<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="game.css">

    <title>Retrouve le tableau de Paul Cézanne !</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@v3.88.1/dist/phaser.js"></script>
    <script src="./dist/bundle.js" type="module"></script>
</head>
<body>
    <div id="container">
        <div id="game"></div>
        <div id="blockly">
            <nav>
                <button id="run"><img src="medias/triangle-filled.svg" alt="triangle" style="transform: rotate(90deg);">Démarrer</button>
                <button id="stop"><img src="medias/square-filled.svg" alt="square">Arrêter</button>
                <button id="reset"><img src="medias/counterclock.svg" alt="arrow">Réinitialiser le niveau</button>
            </nav>
            <div id="blocklyDiv"></div>
        </div>
    </div>
</body>

</html>
